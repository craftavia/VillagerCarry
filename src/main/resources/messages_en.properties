lore-uses-open=<#7CF29A>[<arg:0>/<arg:1>]</#7CF29A>
lore-uses-full=<#FF6B6B>[<arg:0>/<arg:1>]</#FF6B6B>
lore-hint=<#9aa0a6>▸ <#ffd452>Right-click</#ffd452>: place on a block</#9aa0a6>

