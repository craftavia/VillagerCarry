# VillagerCarry messages (MiniMessage). <prefix> is replaced with the prefix below.
# Arguments: <arg:0>, <arg:1>, ... Players see the file matching their client language.
# The egg's name and description use the language of the player who picks the villager up.
prefix=<#5FD38D>Villager</#5FD38D> <dark_gray>▸</dark_gray>

picked-up=<prefix> <#7CF29A>Villager picked up.</#7CF29A> <#9aa0a6>Right-click a block to place it again.</#9aa0a6>
placed=<prefix> <#7CF29A>Villager placed.</#7CF29A>
not-allowed-here=<prefix> <#FF6B6B>You cannot move villagers here.</#FF6B6B>
world-disabled=<prefix> <#FF6B6B>Villagers cannot be moved in this world.</#FF6B6B>
trading=<prefix> <#FF6B6B>Someone is trading with this villager right now.</#FF6B6B>
leashed=<prefix> <#FF6B6B>Unleash the villager first.</#FF6B6B>
baby-disabled=<prefix> <#FF6B6B>Baby villagers cannot be carried.</#FF6B6B>
inventory-full=<prefix> <#FF6B6B>Your inventory is full.</#FF6B6B>
no-room=<prefix> <#FF6B6B>The villager does not fit here, pick a more open spot.</#FF6B6B>
spawner-blocked=<prefix> <#FF6B6B>Villager eggs cannot be used on spawners.</#FF6B6B>
invalid-egg=<prefix> <#FF6B6B>This villager egg is not valid any more and was removed.</#FF6B6B>
error=<prefix> <#FF6B6B>The villager could not be placed, you still have the egg.</#FF6B6B>
reloaded=<prefix> <#7CF29A>Settings reloaded.</#7CF29A>
reload-failed=<prefix> <#FF6B6B>Could not read the configuration, check the server console.</#FF6B6B>
usage=<prefix> <#9aa0a6>Usage: <#ffd452>/villagercarry reload</#ffd452></#9aa0a6>
no-permission=<prefix> <#FF6B6B>You do not have permission to do that.</#FF6B6B>

# Egg name and description. Health: <arg:0> full hearts, <arg:1> empty hearts, <arg:2> value, <arg:3> max.
egg-name=<#5FD38D>Villager Egg</#5FD38D>
lore-type=<#e8c07d>◆ Type:</#e8c07d> <#f3e6c8><arg:0> Villager</#f3e6c8>
lore-adult=<#7CF29A>● Adult</#7CF29A>
lore-baby=<#7CF29A>● Baby</#7CF29A>
lore-health=<#FF6B6B>❤ Health:</#FF6B6B> <#FF6B6B><arg:0></#FF6B6B><dark_gray><arg:1></dark_gray> <#9aa0a6>(<arg:2>/<arg:3>)</#9aa0a6>
# <arg:0> profession, <arg:1> level name
lore-profession=<#5BC0EB>⛏ Profession:</#5BC0EB> <#bfe6ff><arg:0></#bfe6ff> <#9aa0a6>[<arg:1>]</#9aa0a6>
profession-none=Unemployed
# <arg:0> filled bar, <arg:1> empty bar, <arg:2> xp, <arg:3> xp needed for the next level
lore-xp=<#9aa0a6>XP: [</#9aa0a6><#7CF29A><arg:0></#7CF29A><dark_gray><arg:1></dark_gray><#9aa0a6>] <arg:2>/<arg:3></#9aa0a6>
lore-xp-max=<#9aa0a6>XP: <#e8c07d>Max level</#e8c07d> (<arg:0>)</#9aa0a6>
lore-home-title=<#e8c07d>⌂ Previous home:</#e8c07d>
lore-bed=<#9aa0a6> Bed: <#f3e6c8><arg:0></#f3e6c8></#9aa0a6>
lore-bed-none=<#9aa0a6> Bed: <dark_gray>none</dark_gray></#9aa0a6>
lore-job=<#9aa0a6> Workstation: <#f3e6c8><arg:0></#f3e6c8></#9aa0a6>
lore-job-none=<#9aa0a6> Workstation: <dark_gray>none</dark_gray></#9aa0a6>
lore-trades-title=<#e8c07d>◆ Trades (<arg:0>):</#e8c07d>
lore-trades-none=<dark_gray> No trades</dark_gray>
# <arg:0> cost, <arg:1> result
lore-trade=<#f3e6c8> <arg:0></#f3e6c8> <dark_gray>→</dark_gray> <#7CF29A><arg:1></#7CF29A>
# <arg:0> amount, <arg:1> item name
lore-trade-item=<#f3e6c8><arg:0>x</#f3e6c8> <#5BC0EB><arg:1></#5BC0EB>
lore-trade-plus=<dark_gray> + </dark_gray>
lore-trade-enchant=<#C78BFF> ★ <arg:0></#C78BFF>
# <arg:0> uses, <arg:1> xp
lore-trade-info=\u0020\u0020\u0020<arg:0> <dark_gray>|</dark_gray> <#9aa0a6>+<arg:1> XP</#9aa0a6>
